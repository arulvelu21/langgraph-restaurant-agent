[project]
name = "langraphagent"
version = "0.1.0"
description = "A simple LangGraph agent powered by Claude"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "langchain-anthropic>=1.7.4",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.12",
    "python-dotenv>=1.0",
]

[project.scripts]
agent = "agent.cli:main"
restaurant = "restaurant_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/restaurant_agent"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
